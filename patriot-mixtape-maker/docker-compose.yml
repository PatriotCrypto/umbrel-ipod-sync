version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-mixtape-maker_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/mixtape-maker:0.2.0@sha256:4b8971ceadd0ddc0272e9128934887224e4d9a6ad16b3f6ea51c5d1c9b903f14
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: "3000"
      MUSIC_DIR: /music
      DATA_DIR: /data
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads:/music:ro
      - ${APP_DATA_DIR}/data:/data
