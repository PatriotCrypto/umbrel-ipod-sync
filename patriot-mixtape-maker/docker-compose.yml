version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-mixtape-maker_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/mixtape-maker:0.2.1@sha256:e1828a51ab5579ea2368161f4af016e39d49d88c1da35610b779444fcffa030c
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: "3000"
      MUSIC_DIR: /music
      DATA_DIR: /data
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads:/music:ro
      - ${APP_DATA_DIR}/data:/data
