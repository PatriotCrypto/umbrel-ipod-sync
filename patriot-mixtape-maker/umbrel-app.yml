manifestVersion: 1
id: patriot-mixtape-maker
category: media
name: Mixtape Maker
version: "0.2.0"
tagline: Make a cassette mixtape and send it as a digital cassette that opens like a real one
description: >-
  Mixtape Maker brings the 90s mixtape ritual to your Umbrel.


  Pick songs from your own music folder and fit them onto Side A and Side B of a 30, 45, 60 or 90 minute tape. A live
  tape counter shows how much room is left, so you have to make hard choices, just like the old days.


  Give each tape a title, a to/from line and a note, choose a label style (classic red, studio green, chrome blue or plain white), and send it
  to someone as a digital cassette: a single file that opens like a real cassette case, with the lid flipping up to show the cassette and its track list. Email it
  from the app or send the file any way you like. Every tape you make is kept on a shelf so you can reopen and edit it later.


  Your music stays on your Umbrel. Sharing sends only the cassette and its track list, never your songs.


  Music is read from the Umbrel Downloads folder in read-only mode.
